[project]
name            = "practice"
version         = "0.1.0"
authors         = [ { name = "arshtyi", email = "arshtyi@foxmail.com" } ]
requires-python = ">=3.12"
dependencies    = [  ]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [ "I", "UP", "B", "SIM", "RUF", "PERF" ]

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"
line-ending  = "lf"

[tool.ty.src]
include = [ "main.py" ]

[dependency-groups]
dev = [ "ruff", "ty" ]
