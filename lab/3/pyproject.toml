[project]
name = "lab3"
version = "0.1.0"
authors = [
    { name = "arshtyi", email = "arshtyi@foxmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.5.3",
    "scikit-learn>=1.6",
    "torch>=2.14.0",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "PERF",
]

[tool.ruff.format]
quote-style               = "double"
indent-style              = "space"
line-ending               = "auto"
skip-magic-trailing-comma = false

[tool.ty.src]
include = [
    "main.py",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.80",
]
